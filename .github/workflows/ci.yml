name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Validate schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          for p in Path("agents/contracts").glob("*.schema.json"):
              schema = json.loads(p.read_text())
              validator_for(schema).check_schema(schema)
              print(f"ok: {p}")
          PY

      - name: Twin structural smoke test
        run: |
          cd process
          python - <<'PY'
          from twin.train_model import simulate
          s = simulate()
          assert len(s["units"]) == 4
          assert set(s["units"]) == {"degumming","neutralization","bleaching","deodorization"}
          print("twin ok:", s["finished_oil"])
          PY

      - name: Signing round-trip
        run: python scripts/demo_signing.py

      - name: End-to-end pipeline
        run: python scripts/demo_pipeline.py

      - name: Zero-trust attack simulation
        run: python scripts/demo_attacks.py

      - name: Zone conduit enforcement
        run: python scripts/demo_zones.py

      - name: Generate charts (reproducibility)
        run: python scripts/generate_charts.py
